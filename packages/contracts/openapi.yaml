openapi: 3.0.3
info:
  title: Jobseek dashboard API
  version: 0.1.0
  description: Versioned private dashboard API. All data routes require authentication.
servers:
  - url: /api/v1
paths:
  /interviews/prepare:
    post:
      operationId: prepareInterview
      summary: Commission one interview brief from complete owner supplied context
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/PrepareInterviewRequest' } } }
      responses:
        '200':
          {
            description: Existing commission,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/InterviewCommissionResponse' } },
              },
          }
        '201':
          {
            description: Commission created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/InterviewCommissionResponse' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /interviews:
    get:
      operationId: listInterviews
      summary: List private owner interview preparations
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Interview list,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/InterviewList' } } },
          }
  /interviews/{id}:
    get:
      operationId: getInterview
      summary: Read one sourced interview brief and owner debriefs
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          {
            description: Interview and debriefs,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/InterviewDetail' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /interviews/{id}/debrief:
    post:
      operationId: debriefInterview
      summary: Commission a cited owner reported debrief from complete notes
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/DebriefInterviewRequest' } } }
      responses:
        '200':
          {
            description: Existing debrief commission,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/DebriefInterviewResponse' } },
              },
          }
        '201':
          {
            description: Debrief commission created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/DebriefInterviewResponse' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /health:
    get:
      operationId: getHealth
      summary: Check API process health
      responses:
        '200':
          description: API process is serving requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /delivery/capability:
    get:
      operationId: getDeliveryCapability
      summary: Read configured submission and receipt-check capabilities
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Delivery capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryCapability' }
  /delivery/reviews:
    post:
      operationId: prepareDeliveryReview
      summary: Derive exact review material for one to three saved packs
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareDeliveryReviewRequest' }
      responses:
        '201':
          description: Immutable review prepared without sending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryReview' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /delivery/reviews/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getDeliveryReview
      summary: Read exact material, currentness and submission state
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Delivery review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryReview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /delivery/reviews/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: approveDeliveryReview
      summary: Owner approves the exact immutable material digest
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveDeliveryReviewRequest' }
      responses:
        '200':
          description: Approved review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryReview' }
        '409': { $ref: '#/components/responses/Conflict' }
  /delivery/reviews/{id}/send:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: sendDeliveryReview
      summary: Owner starts one finite exact delivery commission
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Per-item submission outcomes and commissioned round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverySendResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /delivery/reviews/{id}/reconcile:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: reconcileDeliveryReview
      summary: Report read-only receipt lookup capability without resending
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Actual adapter lookup capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryReconciliation' }
  /delivery/reviews/{id}/close:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: closeDeliveryReview
      summary: Owner closes a paused unresolved delivery commission without resending
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Closed round; uncertain item remains unresolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Round' }
        '409': { $ref: '#/components/responses/Conflict' }
  /rounds/active:
    get:
      operationId: getActiveRound
      summary: Read the active commissioned round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Active round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /correspondence/threads:
    get:
      operationId: listCorrespondenceThreads
      summary: List private mirrored correspondence threads
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Thread list,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CorrespondenceThreadList' } },
              },
          }
  /correspondence/threads/{id}:
    get:
      operationId: getCorrespondenceThread
      summary: Read one mirrored thread with its complete saved messages
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          {
            description: Thread and messages,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/CorrespondenceThreadDetail' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /correspondence/import:
    post:
      operationId: importCorrespondenceThreads
      summary: Import owner-supplied pasted threads into the read-only mirror
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/ImportCorrespondenceRequest' } },
          }
      responses:
        '200':
          {
            description: Import result,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ImportCorrespondenceResponse' } },
              },
          }
  /correspondence/threads/{id}/process:
    post:
      operationId: processCorrespondenceThread
      summary: Commission reply interpretation and a cited follow-up draft for one thread
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/ProcessRepliesRequest' } } }
      responses:
        '200':
          {
            description: Existing commission,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ReplyCommissionResponse' } },
              },
          }
        '201':
          {
            description: Commission created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ReplyCommissionResponse' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /replies/{id}:
    get:
      operationId: getReplyProcessing
      summary: Read one reply processing with its saved intent and draft
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          {
            description: Processing and draft,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/ReplyProcessingDetail' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/latest-completed:
    get:
      operationId: getLatestCompletedRound
      summary: Read the owner's latest saved round result, including recorded partial delivery
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: outcome
          required: true
          schema:
            {
              type: string,
              enum:
                [
                  all,
                  process_input,
                  prepare,
                  compare_offers,
                  deliver,
                  interview_prepare,
                  interview_debrief,
                  process_replies,
                ],
            }
      responses:
        '200':
          description: Latest matching saved result with transient next-action currentness, or null when none exists
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Round' }]
                nullable: true
        '400': { $ref: '#/components/responses/ValidationError' }
  /rounds/prepare:
    post:
      operationId: prepareRound
      summary: Owner commissions a private pack for a selected sourced opportunity
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareRoundRequest' }
      responses:
        '200':
          {
            description: Existing round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '201':
          {
            description: Round created,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rounds/compare-offers:
    post:
      operationId: compareOffersRound
      summary: Commission one bounded comparison of complete owner supplied offer texts
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompareOffersRoundRequest' }
      responses:
        '200':
          description: Existing intake and round for the exact request key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompareOffersRoundResponse' }
        '201':
          description: New intake and round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompareOffersRoundResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /offer-comparisons/by-round/{roundId}:
    get:
      operationId: getOfferComparisonByRound
      summary: Read the requesting owner's saved comparison for one commissioned round
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: roundId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Saved comparison and captured qualitative selection status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferComparisonResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /offer-comparisons/{id}:
    get:
      operationId: getOfferComparison
      summary: Read the requesting owner's immutable saved comparison
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Saved comparison and captured qualitative selection status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferComparisonResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/process-input:
    post:
      operationId: processOwnerInput
      summary: Save one contextual owner input and commission its bounded record work
      description: The target identity and revision come from the visible record. An exact request key resumes the same saved input and round. A paused replacement requires the owner to name the exact paused round and revision.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessInputRequest' }
      responses:
        '200':
          description: Existing saved input and round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessInputResponse' }
        '201':
          description: Input saved and round commissioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessInputResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rounds/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRound
      summary: Read a commissioned round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/{id}/results:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRoundResults
      summary: Read committed results for a round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Result list,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RoundResults' } } },
          }
  /rounds/{id}/history:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRoundHistory
      summary: Read the round's linked audited record history
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Typed history events
          content: { application/json: { schema: { $ref: '#/components/schemas/RoundHistory' } } }
  /owner-instructions:
    get:
      operationId: listOwnerInstructions
      summary: Read active contextual owner instructions
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: roundId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Owner instructions
          content:
            { application/json: { schema: { $ref: '#/components/schemas/OwnerInstructions' } } }
    post:
      operationId: addOwnerInstruction
      summary: Save explicit owner context for one target
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/OwnerInstructionInput' } } }
      responses:
        '200':
          description: Exact replay
          content:
            { application/json: { schema: { $ref: '#/components/schemas/OwnerInstruction' } } }
        '201':
          description: Instruction saved
          content:
            { application/json: { schema: { $ref: '#/components/schemas/OwnerInstruction' } } }
  /owner-instructions/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: revokeOwnerInstruction
      summary: Revoke an owner instruction before further use
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Instruction revoked }
  /opportunities/{id}/decision:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getOwnerOpportunityDecision
      summary: Read the owner's latest direct decision
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Latest decision
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDecision' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: setOwnerOpportunityDecision
      summary: Save select, dismiss, or acknowledge without a model turn
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/OwnerDecisionInput' } } }
      responses:
        '200':
          description: Exact replay
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDecision' } } }
        '201':
          description: Decision saved
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDecision' } } }
  /rounds/{id}/stop:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: stopRound
      summary: Owner fences further round work and requests cancellation
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Stopped round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
  /rounds/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: resumeRound
      summary: Owner resumes after bounded reconciliation
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Resumed round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rounds/{id}/mutations:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: applyRoundMutation
      summary: Delegated agent performs one atomic round record mutation
      description: Requires a named bearer agent with opportunities:write, present in scope.delegates, and a secret capability bound to one dispatched turn. Actor, resource, operation, profile revision, generation, cost and audit link are checked in one write transaction.
      parameters:
        - name: X-Round-Capability
          in: header
          required: true
          schema: { type: string }
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RoundMutationRequest' } } },
        }
      responses:
        '200':
          {
            description: Exact replay,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/RoundMutationResult' } },
              },
          }
        '201':
          {
            description: Record created,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/RoundMutationResult' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /research/runs:
    post:
      operationId: commissionResearchRun
      summary: Commission one bounded autonomous research run
      description: Creates a run from the current brief plus optional corrections and a finite allowance. No source, query, company or vacancy fields are required. Run control stays on rounds/{id}/stop|resume.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CommissionResearchRequest' } },
          }
      responses:
        '201':
          {
            description: Run commissioned,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ResearchRunView' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /research/runs/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getResearchRun
      summary: Read one research run projection
      description: Side-effect-free; reading never commissions work.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Run view,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ResearchRunView' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/runs/{id}/steer:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: steerResearchRun
      summary: Send a durable steering message to a run
      description: Corrections that change applicable facts or permissions rotate authority and fence affected pending writes.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/SteerResearchRequest' } } }
      responses:
        '200':
          {
            description: Steering message stored,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SteeringMessage' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /research/runs/{id}/activity:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: listResearchActivity
      summary: Page journaled research activity events
      description: Deduplicated event IDs with cursor pagination; reconnect resumes without double-count. Side-effect-free.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          {
            description: Activity page,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/ResearchActivityPage' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/runs/{id}/report:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getResearchReport
      summary: Read the evidence-backed run report
      description: Useful outcomes, what was searched/reused, remaining uncertainty, budget/stop reasons and next work. Side-effect-free.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Run report,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ResearchReportView' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/captures/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getResearchCapture
      summary: Read one immutable capture descriptor
      description: Originals stay server-side; no raw protocol payloads or credentials in the DTO. Side-effect-free.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Capture view,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/ResearchCaptureView' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/identity:
    get:
      operationId: explainResearchIdentity
      summary: Explain an employer/vacancy identity decision
      description: Candidates, decision, basis, assessment and sightings behind a same/new/unresolved call. Side-effect-free.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: subjectKind
          in: query
          required: true
          schema: { type: string, enum: [employer, vacancy] }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          {
            description: Identity explanation,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/ResearchIdentityView' } },
              },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/login:
    post:
      operationId: login
      summary: Start the owner's dashboard session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
