openapi: 3.0.3
info:
  title: Jobseek dashboard API
  version: 0.1.0
  description: Versioned private dashboard API. All data routes require authentication.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API process health
      responses:
        '200':
          description: API process is serving requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Start the owner's dashboard session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current owner session
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/session:
    get:
      operationId: getSession
      summary: Read the current owner session and CSRF token
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active owner session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /preferences:
    get:
      operationId: getPreferences
      summary: Read current qualification preferences
      security:
        - cookieAuth: []
        - bearerAuth: []
      description: Bearer credentials require the preferences:read scope.
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent-credentials:
    get:
      operationId: listAgentCredentials
      summary: List named agent credentials without their tokens
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Credentials metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCredentialList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAgentCredential
      summary: Create a scoped agent token; raw token appears once
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentCredentialRequest'
      responses:
        '201':
          description: Credential and one-time token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAgentCredential'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /agent-credentials/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeAgentCredential
      summary: Revoke an agent token immediately
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Credential revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /companies:
    get:
      operationId: listCompanies
      summary: List companies in stable creation order
      description: Bearer credentials require opportunities:read. Cursor is bound to the archived filter.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Company page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createCompany
      summary: Create a company
      description: Bearer credentials require opportunities:write. Cookie mutations require Origin and X-CSRF-Token. Actor identity is derived from the credential.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyRequest' }
      responses:
        '201':
          description: Saved company and immutable change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getCompany
      summary: Read a company and likely duplicate warnings
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Bearer credentials require opportunities:read.
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchCompany
      summary: Patch a company at its expected revision
      description: Omitted fields are unchanged; an empty optional string clears it. Bearer credentials require opportunities:write. Cookie mutations require Origin and X-CSRF-Token.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchCompanyRequest' }
      responses:
        '200':
          description: Updated company and immutable change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      operationId: archiveCompany
      summary: Archive a company at its expected revision
      description: Bearer credentials require opportunities:write. Cookie mutations require Origin and X-CSRF-Token.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived company and immutable change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /opportunities:
    get:
      operationId: listOpportunities
      summary: List opportunities in stable creation order
      description: Bearer credentials require opportunities:read. Cursor is bound to all filters.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: companyId
          in: query
          schema: { type: string }
        - name: stage
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [employment, project] }
      responses:
        '200':
          description: Opportunity page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOpportunity
      summary: Save an opportunity with its original source
      description: Source URL or original vacancy text is required. Bearer credentials require opportunities:write. The separate openings:ingest scope grants no arbitrary edit access. Cookie mutations require Origin and X-CSRF-Token. Actor and confirmed-pay fields cannot be supplied. Read the saved detail or list for advisory duplicate warnings.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOpportunityRequest' }
      responses:
        '201':
          description: Saved opportunity and immutable change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /opportunities/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getOpportunity
      summary: Read an opportunity and likely duplicate warnings
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Opportunity detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: patchOpportunity
      summary: Patch an opportunity at its expected revision
      description: Omitted fields are unchanged; an empty optional string clears it. Omitted compensation preserves the current advertised inputs; a supplied compensation object replaces all of them, and an empty object resets them to unknown. Bearer credentials require opportunities:write. Cookie mutations require Origin and X-CSRF-Token. Read the saved detail or list for advisory duplicate warnings.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchOpportunityRequest' }
      responses:
        '200':
          description: Updated opportunity and immutable change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /opportunities/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      operationId: archiveOpportunity
      summary: Archive an opportunity at its expected revision
      description: Bearer credentials require opportunities:write. Cookie mutations require Origin and X-CSRF-Token.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveRequest' }
      responses:
        '200':
          description: Archived opportunity and immutable change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /changes:
    get:
      operationId: listRecordChanges
      summary: Read a finite changed-since batch with historical snapshots
      description: Bearer credentials require opportunities:read. Start with after=0; follow nextCursor until empty, then use watermark as after for the next poll. A cursor freezes an upper sequence so later writes cannot enter the current batch.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: entityKind
          in: query
          schema: { type: string, enum: [company, opportunity] }
      responses:
        '200':
          description: Finite change batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordChangePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /changes/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getRecordChange
      summary: Read one immutable audited record change
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Recorded change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordChange' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence-sources:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidenceSources
      summary: Page immutable, attributable evidence sources
      description: Bearer credentials require opportunities:read. Sources remain historical after context changes.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Source page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSourcePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createEvidenceSource
      summary: Record an immutable vacancy snapshot, attributed statement or owner observation
      description: Bearer credentials require evidence:write. Owner observations require an owner session and current preference version. The actor and source kind are server derived.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvidenceSourceRequest' }
      responses:
        '201':
          description: Source recorded and qualification reevaluated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSourceMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /opportunities/{id}/evidence-sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: sourceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidenceSource
      summary: Read an immutable source within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidence
      summary: Page sourced claims, optionally including superseded history
      description: Bearer credentials require opportunities:read. Raw claims are not qualification results.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: includeSuperseded
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Claim page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createEvidence
      summary: Record a typed observation over exact UTF-8 source byte offsets
      description: Bearer credentials require evidence:write. Owner workability requires an owner session. Authority and confirmation are derived, never request fields.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteEvidenceRequest' }
      responses:
        '201':
          description: Claim recorded and qualification reevaluated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /opportunities/{id}/evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: evidenceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidence
      summary: Read one immutable claim within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceClaim' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence/{evidenceId}/supersede:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: evidenceId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: supersedeEvidence
      summary: Append a replacement for an unsuperseded claim
      description: Bearer credentials require evidence:write; owner workability requires an owner session. The prior claim must belong to this opportunity and criterion.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WriteEvidenceRequest' }
      responses:
        '201':
          description: Replacement claim recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /opportunities/{id}/qualification:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getQualification
      summary: Read current qualification, refreshing stale local inputs deterministically
      description: Bearer credentials require opportunities:read. A failed refresh cannot report historical results as current.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Qualification view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Local refresh failed; current is null and historical evaluation is marked outdated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
  /opportunities/{id}/qualification/history:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listQualificationHistory
      summary: Page immutable evaluations, including unverified legacy history
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Evaluation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/qualification/reevaluate:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      operationId: reevaluateQualification
      summary: Explicitly run local deterministic qualification
      description: Bearer credentials require evidence:write. No caller supplied result or evidence is accepted. Cookie mutation requires Origin and CSRF.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: New evaluation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationMutation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jobseek_session
      description: Owner session. Cookie mutations also require X-CSRF-Token and same-origin Origin.
    bearerAuth:
      type: http
      scheme: bearer
      description: Named agent token with operation-specific scopes.
  responses:
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Revision conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          writeOnly: true
    SessionResponse:
      type: object
      required: [actorKind, actorId, csrfToken, expiresAt]
      properties:
        actorKind:
          type: string
          enum: [administrator]
        actorId:
          type: string
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    PreferencesResponse:
      type: object
      required:
        [
          version,
          preferredLocation,
          allowRemote,
          allowHybrid,
          targetHours,
          minMonthlyBaseCents,
          salaryCurrency,
          requireBackendPlatform,
