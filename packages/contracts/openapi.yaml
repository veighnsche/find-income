          type: array
          items: { $ref: '#/components/schemas/QualificationCriterion' }
        salary: { $ref: '#/components/schemas/QualificationSalary' }
    QualificationEvaluation:
      type: object
      required:
        [
          id,
          opportunityId,
          opportunityRevision,
          materialVersion,
          evidenceVersion,
          contextVersion,
          preferencesVersion,
          rulesVersion,
          overall,
          criteria,
          salary,
          sourceRefs,
          optionSetStatus,
          optionSetIds,
          optionResults,
          createdAt,
          actorKind,
          actorId,
        ]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        opportunityRevision: { type: integer, format: int64 }
        materialVersion: { type: integer, format: int64 }
        evidenceVersion: { type: integer, format: int64 }
        contextVersion: { type: integer, format: int64 }
        preferencesVersion: { type: integer, format: int64 }
        rulesVersion: { type: string }
        overall: { type: string, enum: [qualified, unsuitable, unresolved, needs_requalification] }
        criteria:
          type: array
          items: { $ref: '#/components/schemas/QualificationCriterion' }
        salary: { $ref: '#/components/schemas/QualificationSalary' }
        sourceRefs:
          type: array
          items: { $ref: '#/components/schemas/QualificationSourceRef' }
        optionSetStatus: { type: string, enum: [none, current, conflicting] }
        optionSetIds: { type: array, items: { type: string } }
        optionResults:
          type: array
          items: { $ref: '#/components/schemas/QualificationOptionResult' }
        createdAt: { type: string, format: date-time }
        actorKind: { type: string }
        actorId: { type: string }
    QualificationView:
      type: object
      required: [status, current, latestHistorical, currentInputVersions]
      properties:
        status: { type: string, enum: [not_assessed, current, outdated] }
        current:
          allOf: [{ $ref: '#/components/schemas/QualificationEvaluation' }]
          nullable: true
        latestHistorical:
          allOf: [{ $ref: '#/components/schemas/QualificationEvaluation' }]
          nullable: true
        currentInputVersions: { $ref: '#/components/schemas/QualificationInputVersions' }
        refreshError: { type: string, description: Safe message only when local refresh failed. }
    QualificationHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QualificationEvaluation' }
        nextCursor: { type: string }
    QualificationMutation:
      type: object
      required: [evaluation, changeId, currentInputVersions]
      properties:
        evaluation: { $ref: '#/components/schemas/QualificationEvaluation' }
        changeId: { type: string }
        currentInputVersions: { $ref: '#/components/schemas/QualificationInputVersions' }
