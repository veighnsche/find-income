        options:
          type: array
          items: { $ref: '#/components/schemas/OfferOption' }
    OfferOptionSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OfferOptionSet' }
    CreateOfferOptionSetRequest:
      type: object
      additionalProperties: false
      required:
        [sourceId, expectedContextVersion, expectedEvidenceVersion, spanStart, spanEnd, labels]
      properties:
        sourceId: { type: string }
        expectedContextVersion: { type: integer, format: int64, minimum: 1 }
        expectedEvidenceVersion: { type: integer, format: int64, minimum: 0 }
        spanStart: { type: integer, minimum: 0 }
        spanEnd: { type: integer, minimum: 1 }
        labels:
          {
            type: array,
            minItems: 2,
            maxItems: 8,
            items: { type: string, minLength: 1, maxLength: 100 },
          }
        supersedesId: { type: string }
    OfferOptionSetMutation:
      type: object
      required: [set, changeId, currentInputVersions]
      properties:
        set: { $ref: '#/components/schemas/OfferOptionSet' }
        changeId: { type: string }
        currentInputVersions: { $ref: '#/components/schemas/QualificationInputVersions' }
    EvidenceHours:
      type: object
      additionalProperties: false
      required: [minWeekly, maxWeekly, hardBounds]
      properties:
        minWeekly: { type: string, description: 'Exact decimal weekly hours, at most two places.' }
        maxWeekly: { type: string, description: 'Exact decimal weekly hours, at most two places.' }
        hardBounds: { type: boolean }
    EvidenceArrangement:
      type: object
      additionalProperties: false
      required: [pattern, baseLocation, remoteGeography]
      properties:
        pattern: { type: string, enum: [onsite, hybrid, remote] }
        baseLocation: { type: string, maxLength: 500 }
        remoteGeography: { type: string, maxLength: 500 }
        onsiteDays:
          { type: string, description: 'Exact decimal days per week, at most two places.' }
    EvidenceSalary:
      type: object
      additionalProperties: false
      required: [currency, period, basis, amountCents, actualWeeklyHours]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        period: { type: string, enum: [month, year, hour, project] }
        basis: { type: string, enum: [base, inclusive, unknown] }
        amountCents: { type: integer, format: int64, minimum: 0 }
        actualWeeklyHours:
          { type: string, description: 'Exact decimal weekly hours, at most two places.' }
        annualConversion:
          {
            type: string,
            enum: [twelve_equal_monthly_base_payments],
            description: Include only when directly supported by the quoted source.,
          }
    WriteEvidenceRequest:
      type: object
      additionalProperties: false
      required:
        [
          sourceId,
          criterion,
          observedValue,
          spanStart,
          spanEnd,
          expectedEvidenceVersion,
          expectedPreferencesVersion,
        ]
      properties:
        sourceId: { type: string }
        criterion:
          {
            type: string,
            enum:
              [
                role_criterion,
                target_hours_available,
                location_arrangement,
                location_workable,
                monthly_base_salary,
              ],
          }
        finding:
          { type: string, enum: [explicit_match, explicit_mismatch, mention_only, ambiguous] }
        roleCriterionId:
          { type: string, description: Stable ID from the current preference version. }
        rolePresence:
          {
            type: string,
            enum: [explicit_presence, explicit_absence, mention_only, ambiguous],
            description: 'What the exact quote establishes, independent of require/avoid/prefer mode.',
          }
        expectedPreferencesVersion: { type: integer, format: int64, minimum: 1 }
        offerOptionId:
          {
            type: string,
            maxLength: 80,
            description: Named offer option grouping for schedule and economic facts.,
          }
        observedValue:
          {
            type: string,
            maxLength: 1000,
            description: Factual explanation of the selected source span; not a fit verdict.,
          }
        spanStart:
          { type: integer, minimum: 0, description: UTF-8 byte offset into immutable source text. }
        spanEnd: { type: integer, minimum: 1, description: Exclusive UTF-8 byte offset. }
        expectedEvidenceVersion: { type: integer, format: int64, minimum: 0 }
        hours: { $ref: '#/components/schemas/EvidenceHours' }
        arrangement: { $ref: '#/components/schemas/EvidenceArrangement' }
        ownerWorkableForEvidenceId: { type: string }
        salary: { $ref: '#/components/schemas/EvidenceSalary' }
    EvidenceClaim:
      type: object
      required:
        [
          id,
          opportunityId,
          sourceId,
          criterion,
          finding,
          observedValue,
          sourceExcerpt,
          excerptSha256,
          observedAt,
          createdAt,
          hasSpan,
        ]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        sourceId: { type: string }
        sourceKind: { type: string }
        sourceUrl: { type: string }
        sourceContactText: { type: string }
        criterion: { type: string }
        finding: { type: string }
        roleCriterionId: { type: string }
        roleDefinition:
          {
            $ref: '#/components/schemas/RoleCriterion',
            description: Exact criterion definition captured when this claim was written.,
          }
        roleDefinitionHash: { type: string }
        rolePreferencesVersion: { type: integer, format: int64 }
        rolePresence:
          { type: string, enum: [explicit_presence, explicit_absence, mention_only, ambiguous] }
        offerOptionId: { type: string }
        observedValue: { type: string }
        sourceExcerpt: { type: string }
        excerptSha256: { type: string }
        spanStart: { type: integer }
        spanEnd: { type: integer }
        hasSpan: { type: boolean }
        observedAt: { type: string }
        supersedesId: { type: string }
        createdAt: { type: string, format: date-time }
        hours: { $ref: '#/components/schemas/EvidenceHours' }
        arrangement: { $ref: '#/components/schemas/EvidenceArrangement' }
        ownerWorkableForEvidenceId: { type: string }
        ownerPreferencesVersion: { type: integer, format: int64 }
        salary: { $ref: '#/components/schemas/EvidenceSalary' }
    EvidencePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EvidenceClaim' }
        nextCursor: { type: string }
    EvidenceMutation:
      type: object
      required: [evidence, changeId, currentInputVersions]
      properties:
        evidence: { $ref: '#/components/schemas/EvidenceClaim' }
        changeId: { type: string }
        currentInputVersions: { $ref: '#/components/schemas/QualificationInputVersions' }
    QualificationCriterion:
      type: object
      required: [criterion, state, reason, conflicting]
      properties:
        criterion: { type: string }
        criterionId: { type: string }
        label: { type: string }
        description: { type: string }
        kind:
          { type: string, enum: [role, responsibility, technology, working_terms, compensation] }
        mode: { type: string, enum: [require, avoid, prefer] }
        blocking: { type: boolean }
        relevant: { type: boolean }
        sourceBasis: { type: string }
        evidenceIds: { type: array, items: { type: string } }
        state: { type: string, enum: [match, mismatch, unknown] }
        reason: { type: string }
        conflicting: { type: boolean }
    QualificationEstimate:
      type: object
      required: [minDisplayCents, maxDisplayCents, targetHours, referenceHours, currency]
      properties:
        minDisplayCents: { type: integer, format: int64 }
        maxDisplayCents: { type: integer, format: int64 }
        targetHours: { type: string }
        referenceHours: { type: string }
        currency: { type: string }
        annualConversion: { type: string }
    QualificationSalary:
      type: object
      required: [state, reason, confirmedActual, conflicting]
      properties:
        state: { type: string, enum: [match, mismatch, unknown] }
        reason: { type: string }
        estimate: { $ref: '#/components/schemas/QualificationEstimate' }
        confirmedActual: { type: boolean }
        conflicting: { type: boolean }
        applicable: { type: boolean }
        concern: { type: boolean }
        currency: { type: string }
        targetHours: { type: string }
        sourceBasis: { type: string }
        annualConversion: { type: string }
    QualificationSourceRef:
      type: object
      required: [evidenceId, sourceId]
      properties:
        evidenceId: { type: string }
        sourceId: { type: string }
    QualificationOptionResult:
      type: object
      required: [optionId, label, overall, criteria, salary]
      properties:
        optionId: { type: string }
        label: { type: string }
        overall: { type: string, enum: [qualified, unsuitable, unresolved, needs_requalification] }
        criteria:
          type: array
          items: { $ref: '#/components/schemas/QualificationCriterion' }
        salary: { $ref: '#/components/schemas/QualificationSalary' }
    QualificationEvaluation:
      type: object
      required:
        [
          id,
          opportunityId,
          opportunityRevision,
          materialVersion,
          evidenceVersion,
          contextVersion,
          preferencesVersion,
          rulesVersion,
          overall,
          criteria,
          salary,
          sourceRefs,
          optionSetStatus,
          optionSetIds,
          optionResults,
          createdAt,
          actorKind,
          actorId,
        ]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        opportunityRevision: { type: integer, format: int64 }
        materialVersion: { type: integer, format: int64 }
        evidenceVersion: { type: integer, format: int64 }
        contextVersion: { type: integer, format: int64 }
        preferencesVersion: { type: integer, format: int64 }
        rulesVersion: { type: string }
        overall: { type: string, enum: [qualified, unsuitable, unresolved, needs_requalification] }
        criteria:
          type: array
          items: { $ref: '#/components/schemas/QualificationCriterion' }
        salary: { $ref: '#/components/schemas/QualificationSalary' }
        sourceRefs:
          type: array
          items: { $ref: '#/components/schemas/QualificationSourceRef' }
        optionSetStatus: { type: string, enum: [none, current, conflicting] }
        optionSetIds: { type: array, items: { type: string } }
        optionResults:
          type: array
          items: { $ref: '#/components/schemas/QualificationOptionResult' }
        createdAt: { type: string, format: date-time }
        actorKind: { type: string }
        actorId: { type: string }
    QualificationView:
      type: object
      required: [status, current, latestHistorical, currentInputVersions]
      properties:
        status: { type: string, enum: [not_assessed, current, outdated] }
        current:
          allOf: [{ $ref: '#/components/schemas/QualificationEvaluation' }]
          nullable: true
        latestHistorical:
          allOf: [{ $ref: '#/components/schemas/QualificationEvaluation' }]
          nullable: true
        currentInputVersions: { $ref: '#/components/schemas/QualificationInputVersions' }
        refreshError: { type: string, description: Safe message only when local refresh failed. }
    QualificationHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QualificationEvaluation' }
        nextCursor: { type: string }
    QualificationMutation:
      type: object
      required: [evaluation, changeId, currentInputVersions]
      properties:
        evaluation: { $ref: '#/components/schemas/QualificationEvaluation' }
        changeId: { type: string }
        currentInputVersions: { $ref: '#/components/schemas/QualificationInputVersions' }
    ResearchAllowance:
      type: object
      required: [timeMs, maxActions, maxJev, maxTurns, maxConcurrent]
      properties:
        timeMs: { type: integer, minimum: 1 }
        maxActions: { type: integer, minimum: 1 }
        maxJev: { type: integer, minimum: 0 }
        maxTurns: { type: integer, minimum: 1 }
        maxConcurrent: { type: integer, minimum: 1, maximum: 4 }
    ResearchUsage:
      type: object
      required: [enforced, reserved, observed, unknown]
      properties:
        enforced: { $ref: '#/components/schemas/ResearchAllowance' }
        reserved:
          type: object
          required: [actions, jev, turns]
          properties:
            actions: { type: integer, minimum: 0 }
            jev: { type: integer, minimum: 0 }
            turns: { type: integer, minimum: 0 }
        observed:
          type: object
          required: [actions, jev, turns, bytes]
          properties:
            actions: { type: integer, minimum: 0 }
            jev: { type: integer, minimum: 0 }
            turns: { type: integer, minimum: 0 }
            bytes: { type: integer, minimum: 0 }
        unknown:
          { type: boolean, description: True once any uncertain work exists; never silently false. }
    ResearchInvestigation:
      type: object
      required: [id, intent, status]
      properties:
        id: { type: string }
        intent: { type: string }
        status: { type: string, enum: [open, active, concluded, exhausted] }
    CommissionResearchRequest:
      type: object
      additionalProperties: false
      properties:
        briefText: { type: string, maxLength: 20000 }
        correctionsRef: { type: string }
        allowance: { $ref: '#/components/schemas/ResearchAllowance' }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    ResearchRunView:
      type: object
      required:
        [runId, state, briefVersion, allowance, usage, investigations, savedIds, unresolvedCount]
      properties:
        runId: { type: string }
        state:
          type: string
          enum: [queued, running, awaiting_input, stopping, paused, completed, failed]
        briefVersion:
          type: object
          required: [profileVersion, rubricVersion]
          properties:
            profileVersion: { type: integer }
            rubricVersion: { type: string }
        allowance: { $ref: '#/components/schemas/ResearchAllowance' }
        usage: { $ref: '#/components/schemas/ResearchUsage' }
        investigations:
          type: array
          items: { $ref: '#/components/schemas/ResearchInvestigation' }
        savedIds: { type: array, items: { type: string } }
        unresolvedCount: { type: integer, minimum: 0 }
        stopReason: { type: string }
        reportRef: { type: string }
    SteerResearchRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 20000 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    SteeringMessage:
      type: object
      required: [messageId, revision, body, ack]
      properties:
        messageId: { type: string }
        revision: { type: integer, minimum: 1 }
        body: { type: string }
        ack: { type: string, enum: [pending, acknowledged, applied] }
    ResearchActivityEvent:
      type: object
      required: [eventId, at, kind, summary]
      properties:
        eventId: { type: string }
        cursor: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string }
        summary: { type: string }
        refs:
          type: object
          additionalProperties: false
          properties:
            observationId: { type: string }
            captureId: { type: string }
            recordId: { type: string }
            assessmentId: { type: string }
    ResearchActivityPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/ResearchActivityEvent' }
        nextCursor: { type: string }
    ResearchCaptureView:
      type: object
      required: [captureId, observedUrl, retrievedAt, status, mediaType, contentHash, extent]
      properties:
        captureId: { type: string }
        observedUrl: { type: string }
        finalUrl: { type: string }
        retrievedAt: { type: string, format: date-time }
        status: { type: string }
        mediaType: { type: string }
        contentHash: { type: string }
        extent:
          type: object
          required: [bytes, complete]
          properties:
            bytes: { type: integer, minimum: 0 }
            complete: { type: boolean }
            truncation: { type: string }
        excerptRefs:
          type: array
          items:
            type: object
            required: [spanStart, spanEnd, excerptSha256]
            properties:
              spanStart: { type: integer, minimum: 0 }
              spanEnd: { type: integer, minimum: 0 }
              excerptSha256: { type: string }
    ResearchIdentityCandidate:
      type: object
      required: [recordId, revision]
      properties:
        recordId: { type: string }
        revision: { type: integer, minimum: 1 }
    ResearchIdentityView:
      type: object
      required: [subjectId, candidates, decision, basis]
      properties:
        subjectId: { type: string }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ResearchIdentityCandidate' }
        decision: { type: string, enum: [same, new, unresolved] }
        basis: { type: string }
        assessmentId: { type: string }
        sightings:
          type: array
          items:
            type: object
            required: [captureId, observedUrl, observedAt]
            properties:
              captureId: { type: string }
              observedUrl: { type: string }
              observedAt: { type: string, format: date-time }
    ResearchReportView:
      type: object
      required: [runId, outcomes, searched, reused, uncertainty, budget]
      properties:
        runId: { type: string }
        outcomes: { type: array, items: { type: string } }
        searched: { type: array, items: { type: string } }
        reused: { type: array, items: { type: string } }
        uncertainty: { type: array, items: { type: string } }
        budget:
          type: object
          required: [observed, unknown]
          properties:
            observed: { $ref: '#/components/schemas/ResearchUsage' }
            unknown: { type: boolean }
            stopReason: { type: string }
        nextWork: { type: array, items: { type: string } }
