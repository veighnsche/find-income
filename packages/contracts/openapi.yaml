      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getIngestion
      summary: Read durable processing status and linked opportunity
      description: Owner can read all submissions. A bearer credential with openings:ingest can read only its own submissions.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Ingestion status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ingestions/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      operationId: retryIngestion
      summary: Retry a failed submission or add full text when the URL needs it
      description: Owner cookie or bearer credential with openings:ingest. A bearer credential can retry only its own submission. Cookie mutations require allowed Origin and X-CSRF-Token. Only terminal failed or needs_text submissions can be retried.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryIngestionRequest' }
      responses:
        '202':
          description: New queued job for the existing submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /opportunities:
    get:
      operationId: listOpportunities
      summary: List opportunities in stable creation order
      description: Bearer credentials require opportunities:read. Cursor is bound to all filters.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: companyId
          in: query
          schema: { type: string }
        - name: stage
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [employment, project] }
      responses:
        '200':
          description: Opportunity page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /opportunities/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getOpportunity
      summary: Read an opportunity and likely duplicate warnings
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Opportunity detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /actions:
    get:
      operationId: listActions
      summary: List follow-up actions in creation order
      description: Bearer credentials require actions:read. Filters are bound to the cursor. Actions for archived opportunities remain readable.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { type: string, enum: [open, completed, cancelled] }
        - name: opportunityId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Bounded current-action page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /actions/due:
    get:
      operationId: listDueActions
      summary: List open actions due at an explicit clock
      description: Bearer credentials require actions:read. Date-only actions are due on their calendar date in calendarTimezone; timed actions are due at their absolute instant. Clock and timezone are bound to the cursor.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ActionClock'
        - $ref: '#/components/parameters/ActionCalendarTimezone'
      responses:
        '200':
          description: Bounded due-action page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /actions/overdue:
    get:
      operationId: listOverdueActions
      summary: List open actions overdue at an explicit clock
      description: Bearer credentials require actions:read. Date-only actions become overdue on a later local calendar day; timed actions become overdue after their absolute instant. Clock and timezone are bound to the cursor.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ActionClock'
        - $ref: '#/components/parameters/ActionCalendarTimezone'
      responses:
        '200':
          description: Bounded overdue-action page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /actions/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getAction
      summary: Read a follow-up action
      description: Bearer credentials require actions:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Current action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /actions/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: completeAction
      summary: Complete an open action once
      description: Bearer credentials require actions:write. A 409 includes currentAction; no duplicate completion or audit is written.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionTransitionRequest' }
      responses:
        '200':
          description: Completed action and audit change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /actions/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: cancelAction
      summary: Cancel an open action once
      description: Bearer credentials require actions:write. A 409 includes currentAction; no duplicate cancellation or audit is written.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionTransitionRequest' }
      responses:
        '200':
          description: Cancelled action and audit change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /changes:
    get:
      operationId: listRecordChanges
      summary: Read a finite changed-since batch with historical snapshots
      description: Bearer credentials require opportunities:read. Start with after=0; follow nextCursor until empty, then use watermark as after for the next poll. A cursor freezes an upper sequence so later writes cannot enter the current batch.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: entityKind
          in: query
          schema: { type: string, enum: [company, opportunity] }
      responses:
        '200':
          description: Finite change batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordChangePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /changes/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getRecordChange
      summary: Read one immutable audited record change
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Recorded change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordChange' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence-sources:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidenceSources
      summary: Page immutable, attributable evidence sources
      description: Bearer credentials require opportunities:read. Sources remain historical after context changes.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Source page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSourcePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence-sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: sourceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidenceSource
      summary: Read an immutable source within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidence
      summary: Page sourced claims, optionally including superseded history
      description: Bearer credentials require opportunities:read. Raw claims are not qualification results.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: includeSuperseded
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Claim page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: evidenceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidence
      summary: Read one immutable claim within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceClaim' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/qualification:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getQualification
      summary: Read current qualification, refreshing stale local inputs deterministically
      description: Bearer credentials require opportunities:read. A failed refresh cannot report historical results as current.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Qualification view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Local refresh failed; current is null and historical evaluation is marked outdated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
  /opportunities/{id}/qualification/history:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listQualificationHistory
      summary: Page immutable evaluations with captured preference versions
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Evaluation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
    ActionClock:
      name: at
      in: query
      required: true
      description: Explicit RFC3339 instant with offset.
      schema: { type: string, format: date-time }
    ActionCalendarTimezone:
      name: calendarTimezone
      in: query
      required: true
      description: IANA timezone used only to compare date-only deadlines.
      schema: { type: string }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jobseek_session
      description: Owner session. Cookie mutations also require X-CSRF-Token and same-origin Origin.
    bearerAuth:
      type: http
      scheme: bearer
      description: Named agent token with operation-specific scopes.
  responses:
    Unavailable:
      description: Required round execution capability is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Revision conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RoundAllowance:
      type: object
      required: [requests, items, tools, turns]
      properties:
        requests: { type: integer, format: int64, minimum: 0 }
        items: { type: integer, format: int64, minimum: 0 }
        tools: { type: integer, format: int64, minimum: 0 }
        turns: { type: integer, format: int64, minimum: 0 }
    RoundScope:
      type: object
      required: [inputRefs, resources, operations, delegates]
      properties:
        inputRefs: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        operations: { type: array, items: { type: string } }
        delegates: { type: array, items: { type: string } }
    ProcessInputRequest:
      type: object
      additionalProperties: false
      required: [requestKey, targetKind, targetId, expectedRevision]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
        targetKind:
          {
            type: string,
            enum: [campaign, profile, opportunity, evidence, relationship, application_pack],
          }
        targetId: { type: string, minLength: 1 }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        text: { type: string, minLength: 1, maxLength: 20000 }
        sourceUrl: { type: string, format: uri }
        originalText: { type: string, minLength: 1, maxLength: 200000 }
        replacePaused: { $ref: '#/components/schemas/ReplacePausedRound' }
    ReplacePausedRound:
      type: object
      additionalProperties: false
      required: [roundId, expectedRevision]
      properties:
        roundId: { type: string, minLength: 1 }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
    ProcessInputResponse:
      type: object
      required: [round]
      properties:
        round: { $ref: '#/components/schemas/Round' }
        instructionId: { type: string }
        ingestionId: { type: string }
        replacedRoundId: { type: string }
    Round:
      type: object
      required:
        [
          id,
          requestKey,
          intent,
          outcome,
          originalProfileVersion,
          effectiveProfileVersion,
          profileVersion,
          scope,
          state,
          revision,
          generation,
          deadline,
          limits,
          used,
          step,
          cursor,
          unresolved,
          report,
          stopReason,
          deliverableStatus,
          reconciliationRequired,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        requestKey: { type: string }
        intent: { type: string }
        outcome: { type: string }
        originalProfileVersion: { type: integer, format: int64 }
        effectiveProfileVersion: { type: integer, format: int64 }
        profileVersion: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/RoundScope' }
        state:
          {
            type: string,
            enum: [queued, running, awaiting_input, stopping, paused, completed, failed],
          }
        revision: { type: integer, format: int64 }
        generation: { type: integer, format: int64 }
        deadline: { type: string, format: date-time }
        limits: { $ref: '#/components/schemas/RoundAllowance' }
        used: { $ref: '#/components/schemas/RoundAllowance' }
        step: { type: string }
        cursor: { type: object, additionalProperties: true }
        unresolved: { type: array, items: {} }
        report: { type: object, additionalProperties: true }
        stopReason: { type: string }
        deliverableStatus: { type: string }
        reconciliationRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    RoundResults:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
    RoundHistory:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoundHistoryEvent' } }
    RunHistoryItem:
      type: object
      required: [runId, requestKey, intent, outcome, state, stopReason, createdAt, updatedAt]
      properties:
        runId: { type: string }
        requestKey: { type: string }
        intent: { type: string }
        outcome: { type: string }
        state: { type: string }
        stopReason: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        completedAt: { type: string }
    RunHistoryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RunHistoryItem' } }
        nextCursor: { type: string }
    SourcedOwnerContext:
      type: object
      required: [owner, sourcesConnected, sources]
      properties:
        owner:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string }
            id: { type: string }
        sourcesConnected: { type: boolean }
        sources:
          type: array
          items:
            type: object
            required: [id, name, sha256, approved, body]
            properties:
              id: { type: string }
              name: { type: string }
              sha256: { type: string }
              approved: { type: boolean }
              body: { type: string }
    RoundHistoryEvent:
      type: object
      required: [auditId, attemptId, operation, entityKind, entityId, occurredAt]
      properties:
        auditId: { type: string }
        attemptId: { type: string }
        operation: { type: string }
        entityKind: { type: string }
        entityId: { type: string }
        revisionBefore: { type: integer, format: int64 }
        revisionAfter: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
    OwnerInstructionInput:
      type: object
      additionalProperties: false
      required: [requestKey, targetKind, targetId, expectedRevision, text]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
        targetKind:
          {
            type: string,
            enum: [campaign, profile, opportunity, evidence, relationship, application_pack],
          }
        targetId: { type: string }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        roundId: { type: string }
        text: { type: string, minLength: 1, maxLength: 20000 }
    OwnerInstruction:
      allOf:
        - { $ref: '#/components/schemas/OwnerInstructionInput' }
        - type: object
          required: [id, actorId, createdAt]
          properties:
            id: { type: string }
            actorId: { type: string }
            createdAt: { type: string, format: date-time }
            revokedAt: { type: string, format: date-time }
    OwnerInstructions:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OwnerInstruction' } }
    OwnerDecisionInput:
      type: object
      additionalProperties: false
      required: [requestKey, expectedOpportunityRevision, expectedDecisionRevision, decision]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
        expectedOpportunityRevision: { type: integer, format: int64, minimum: 1 }
        expectedDecisionRevision: { type: integer, format: int64, minimum: 0 }
        decision: { type: string, enum: [selected, dismissed, acknowledged] }
    OwnerDecision:
      type: object
      required: [id, opportunityId, decision, revision, opportunityRevision, auditId, createdAt]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        decision: { type: string, enum: [selected, dismissed, acknowledged] }
        revision: { type: integer, format: int64 }
        opportunityRevision: { type: integer, format: int64 }
        auditId: { type: string }
        createdAt: { type: string, format: date-time }
    RoleWorkflowState:
      type: object
      required: [opportunityId, stage, revision, updatedAt, decisionAt, opportunityRevision]
      properties:
        opportunityId: { type: string }
        stage:
          {
            type: string,
            enum:
              [
                selected,
                checking,
                checked,
                answering,
                answered,
                preparing,
                prepared,
                handoff_saved,
                blocked,
              ],
          }
