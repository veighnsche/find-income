      type: object
      additionalProperties: false
      required:
        [sourceId, criterion, finding, observedValue, spanStart, spanEnd, expectedEvidenceVersion]
      properties:
        sourceId: { type: string }
        criterion:
          {
            type: string,
            enum:
              [
                backend_platform,
                no_frontend_duties,
                no_php_focused_duties,
                target_hours_available,
                location_arrangement,
                location_workable,
                monthly_base_salary,
              ],
          }
        finding:
          { type: string, enum: [explicit_match, explicit_mismatch, mention_only, ambiguous] }
        observedValue: { type: string, maxLength: 1000 }
        spanStart:
          { type: integer, minimum: 0, description: UTF-8 byte offset into immutable source text. }
        spanEnd: { type: integer, minimum: 1, description: Exclusive UTF-8 byte offset. }
        expectedEvidenceVersion: { type: integer, format: int64, minimum: 0 }
