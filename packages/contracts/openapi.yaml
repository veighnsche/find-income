      properties:
        currency: { type: string, description: Uppercase three-letter code or unknown. }
        minAmountCents: { type: integer, format: int64, minimum: 0 }
        maxAmountCents: { type: integer, format: int64, minimum: 0 }
        period: { type: string, enum: [month, year, hour, project, unknown] }
        referenceHours:
          { type: string, description: Exact decimal weekly hours with at most two places. }
        annualConversion:
          {
            type: string,
            enum: [twelve_equal_monthly_base_payments],
            description: Only when an exact source span states twelve equal monthly base payments for an annual base amount.,
          }
        annualConversionSpanStart:
          {
            type: integer,
            minimum: 0,
            description: UTF-8 byte offset into originalText for annual payment basis.,
          }
        annualConversionSpanEnd:
          {
            type: integer,
            minimum: 1,
            description: Exclusive UTF-8 byte offset for annual payment basis.,
          }
