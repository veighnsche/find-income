openapi: 3.0.3
info:
  title: Jobseek dashboard API
  version: 0.1.0
  description: Versioned private dashboard API. All data routes require authentication.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API process health
      responses:
        '200':
          description: API process is serving requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /rounds/active:
    get:
      operationId: getActiveRound
      summary: Read the active commissioned round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Active round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/capability:
    get:
      operationId: getRoundCapability
      summary: Read server-selected outcome and current execution availability
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Capability and bounded plan summary,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RoundCapability' } } },
          }
  /rounds:
    post:
      operationId: startRound
      summary: Owner starts one commissioned outcome
      description: Requires owner session, same-origin CSRF token, and a ready execution capability. An exact requestKey replay returns the existing round.
      security: [{ cookieAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/StartRoundRequest' } } },
        }
      responses:
        '200':
          {
            description: Existing round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '201':
          {
            description: Round created,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rounds/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRound
      summary: Read a commissioned round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/{id}/results:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRoundResults
      summary: Read committed results for a round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Result list,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RoundResults' } } },
          }
  /rounds/{id}/stop:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: stopRound
      summary: Owner fences further round work and requests cancellation
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Stopped round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
  /rounds/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: resumeRound
      summary: Owner resumes after bounded reconciliation
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Resumed round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rounds/{id}/mutations:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: applyRoundMutation
      summary: Delegated agent performs one atomic round record mutation
      description: Requires a named bearer agent with opportunities:write, present in scope.delegates, and a secret capability bound to one dispatched turn. Actor, resource, operation, profile revision, generation, cost and audit link are checked in one write transaction.
      parameters:
        - name: X-Round-Capability
          in: header
          required: true
          schema: { type: string }
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RoundMutationRequest' } } },
        }
      responses:
        '200':
          {
            description: Exact replay,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/RoundMutationResult' } },
              },
          }
        '201':
          {
            description: Record created,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/RoundMutationResult' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      operationId: login
      summary: Start the owner's dashboard session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current owner session
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/session:
    get:
      operationId: getSession
      summary: Read the current owner session and CSRF token
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active owner session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /preferences:
    get:
      operationId: getPreferences
      summary: Read current qualification preferences
      security:
        - cookieAuth: []
        - bearerAuth: []
      description: Bearer credentials require the preferences:read scope.
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /agent-credentials:
    get:
      operationId: listAgentCredentials
      summary: List named agent credentials without their tokens
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Credentials metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCredentialList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAgentCredential
      summary: Create a scoped agent token; raw token appears once
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentCredentialRequest'
      responses:
        '201':
          description: Credential and one-time token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAgentCredential'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /agent-credentials/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeAgentCredential
      summary: Revoke an agent token immediately
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Credential revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /companies:
    get:
      operationId: listCompanies
      summary: List companies in stable creation order
      description: Bearer credentials require opportunities:read. Cursor is bound to the archived filter.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Company page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getCompany
      summary: Read a company and likely duplicate warnings
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Bearer credentials require opportunities:read.
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /codex/status:
    get:
      operationId: getCodexStatus
      summary: Read isolated Codex account and ingestion readiness
      description: Owner session required. Status never includes a sign-in code. Ready requires connected account and verified scoped tools.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Safe connection state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodexStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /codex/connect:
    post:
      operationId: connectCodex
      summary: Start owner device sign-in for the isolated Codex runner
      description: Owner cookie, allowed Origin and X-CSRF-Token required. Returns an official verification URL and short-lived user code only to the owner.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Device sign-in instructions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodexConnection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/InternalError' }
  /codex/connect/cancel:
    post:
      operationId: cancelCodexConnect
      summary: Cancel the current owner device sign-in attempt
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Sign-in attempt cancelled or absent }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /runtime-status:
    get:
      operationId: getRuntimeStatus
      summary: Read whether ingestion and organisation workers are mounted
      description: Availability reflects actual server startup, not the presence of queued jobs.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Runtime worker availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /organisation/categories:
    get:
      operationId: getOrganisationCategories
      summary: Read the owner's current category definitions
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Current categories, or version zero before configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationCategorySet' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /organisation/summaries:
    get:
      operationId: getOrganisationSummaries
      summary: Read organisation status for up to 100 loaded opportunities
      description: Bearer credentials require opportunities:read. Comma-separated IDs are bounded to 100; missing IDs are omitted.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationSummaryList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collector-boards:
    get:
      operationId: listCollectorBoards
      summary: List configured collection boards and their last observed run status
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Collection board settings and run status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorBoardList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /opportunities/{id}/organisation:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getOpportunityOrganisation
      summary: Read current and historical organisation status
      description: Bearer credentials require opportunities:read. Category descriptions and source facts are captured at assessment time; source references are separate from the model decision.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Organisation result and status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ingestions:
    get:
      operationId: listIngestions
      summary: List durable vacancy submissions and collection results
      description: Owner session required. Results include pending and failed submissions; processing status is derived from the job record.
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ingestion page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: submitIngestion
      summary: Persist a vacancy URL or full text for processing
      description: Owner cookie or bearer credential with openings:ingest. Cookie mutations require allowed Origin and X-CSRF-Token. Origin and actor derive from credentials. The source and queued job are saved atomically. Submission does not imply processing or an opportunity was created.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitIngestionRequest' }
      responses:
        '202':
          description: Durable queued submission, including an idempotent repeat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /ingestions/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getIngestion
      summary: Read durable processing status and linked opportunity
      description: Owner can read all submissions. A bearer credential with openings:ingest can read only its own submissions.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Ingestion status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ingestions/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    post:
      operationId: retryIngestion
      summary: Retry a failed submission or add full text when the URL needs it
      description: Owner cookie or bearer credential with openings:ingest. A bearer credential can retry only its own submission. Cookie mutations require allowed Origin and X-CSRF-Token. Only terminal failed or needs_text submissions can be retried.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryIngestionRequest' }
      responses:
        '202':
          description: New queued job for the existing submission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestionRequest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /opportunities:
    get:
      operationId: listOpportunities
      summary: List opportunities in stable creation order
      description: Bearer credentials require opportunities:read. Cursor is bound to all filters.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
        - name: companyId
          in: query
          schema: { type: string }
        - name: stage
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [employment, project] }
      responses:
        '200':
          description: Opportunity page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /opportunities/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getOpportunity
      summary: Read an opportunity and likely duplicate warnings
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Opportunity detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /actions:
    get:
      operationId: listActions
      summary: List follow-up actions in creation order
      description: Bearer credentials require actions:read. Filters are bound to the cursor. Actions for archived opportunities remain readable.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { type: string, enum: [open, completed, cancelled] }
        - name: opportunityId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Bounded current-action page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /actions/due:
    get:
      operationId: listDueActions
      summary: List open actions due at an explicit clock
      description: Bearer credentials require actions:read. Date-only actions are due on their calendar date in calendarTimezone; timed actions are due at their absolute instant. Clock and timezone are bound to the cursor.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ActionClock'
        - $ref: '#/components/parameters/ActionCalendarTimezone'
      responses:
        '200':
          description: Bounded due-action page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /actions/overdue:
    get:
      operationId: listOverdueActions
      summary: List open actions overdue at an explicit clock
      description: Bearer credentials require actions:read. Date-only actions become overdue on a later local calendar day; timed actions become overdue after their absolute instant. Clock and timezone are bound to the cursor.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ActionClock'
        - $ref: '#/components/parameters/ActionCalendarTimezone'
      responses:
        '200':
          description: Bounded overdue-action page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /actions/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getAction
      summary: Read a follow-up action
      description: Bearer credentials require actions:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Current action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /actions/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: completeAction
      summary: Complete an open action once
      description: Bearer credentials require actions:write. A 409 includes currentAction; no duplicate completion or audit is written.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionTransitionRequest' }
      responses:
        '200':
          description: Completed action and audit change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /actions/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: cancelAction
      summary: Cancel an open action once
      description: Bearer credentials require actions:write. A 409 includes currentAction; no duplicate cancellation or audit is written.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionTransitionRequest' }
      responses:
        '200':
          description: Cancelled action and audit change reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionMutation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /changes:
    get:
      operationId: listRecordChanges
      summary: Read a finite changed-since batch with historical snapshots
      description: Bearer credentials require opportunities:read. Start with after=0; follow nextCursor until empty, then use watermark as after for the next poll. A cursor freezes an upper sequence so later writes cannot enter the current batch.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: entityKind
          in: query
          schema: { type: string, enum: [company, opportunity] }
      responses:
        '200':
          description: Finite change batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordChangePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /changes/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getRecordChange
      summary: Read one immutable audited record change
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Recorded change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordChange' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/offer-option-sets:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listCurrentOfferOptionSets
      summary: Read current source-backed offer alternatives
      description: Bearer credentials require opportunities:read. Multiple current sets may require clarification before choosing an option.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Current alternatives
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferOptionSetList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence-sources:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidenceSources
      summary: Page immutable, attributable evidence sources
      description: Bearer credentials require opportunities:read. Sources remain historical after context changes.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Source page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSourcePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence-sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: sourceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidenceSource
      summary: Read an immutable source within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidence
      summary: Page sourced claims, optionally including superseded history
      description: Bearer credentials require opportunities:read. Raw claims are not qualification results.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: includeSuperseded
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Claim page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: evidenceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidence
      summary: Read one immutable claim within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceClaim' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/qualification:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getQualification
      summary: Read current qualification, refreshing stale local inputs deterministically
      description: Bearer credentials require opportunities:read. A failed refresh cannot report historical results as current.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Qualification view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Local refresh failed; current is null and historical evaluation is marked outdated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
  /opportunities/{id}/qualification/history:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listQualificationHistory
      summary: Page immutable evaluations with captured preference versions
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Evaluation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
    ActionClock:
      name: at
      in: query
      required: true
      description: Explicit RFC3339 instant with offset.
      schema: { type: string, format: date-time }
    ActionCalendarTimezone:
      name: calendarTimezone
      in: query
      required: true
      description: IANA timezone used only to compare date-only deadlines.
      schema: { type: string }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jobseek_session
      description: Owner session. Cookie mutations also require X-CSRF-Token and same-origin Origin.
    bearerAuth:
      type: http
      scheme: bearer
      description: Named agent token with operation-specific scopes.
  responses:
    Unavailable:
      description: Required round execution capability is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Revision conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    RoundAllowance:
      type: object
      required: [requests, items, tools, turns]
      properties:
        requests: { type: integer, format: int64, minimum: 0 }
        items: { type: integer, format: int64, minimum: 0 }
        tools: { type: integer, format: int64, minimum: 0 }
        turns: { type: integer, format: int64, minimum: 0 }
    RoundScope:
      type: object
      required: [inputRefs, resources, operations, delegates]
      properties:
        inputRefs: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        operations: { type: array, items: { type: string } }
        delegates: { type: array, items: { type: string } }
    StartRoundRequest:
      type: object
      additionalProperties: false
      description: Owner Start sends only a durable click idempotency key; the server chooses the current outcome, profile, scope, allowance and deadline.
      required: [requestKey]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
    RoundCapability:
      type: object
      required: [canStart, reason, intent, outcome, limits, sourceCount]
      properties:
        canStart: { type: boolean }
        reason: { type: string }
        intent: { type: string }
        outcome: { type: string }
        limits: { $ref: '#/components/schemas/RoundAllowance' }
        sourceCount: { type: integer, minimum: 0 }
    Round:
      type: object
      required:
        [
          id,
          intent,
          outcome,
          profileVersion,
          scope,
          state,
          revision,
          generation,
          deadline,
          limits,
          used,
          step,
          cursor,
          unresolved,
          report,
          stopReason,
          deliverableStatus,
          reconciliationRequired,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        intent: { type: string }
        outcome: { type: string }
        profileVersion: { type: integer, format: int64 }
        scope: { $ref: '#/components/schemas/RoundScope' }
        state:
          {
            type: string,
            enum: [queued, running, awaiting_input, stopping, paused, completed, failed],
          }
        revision: { type: integer, format: int64 }
        generation: { type: integer, format: int64 }
        deadline: { type: string, format: date-time }
        limits: { $ref: '#/components/schemas/RoundAllowance' }
        used: { $ref: '#/components/schemas/RoundAllowance' }
        step: { type: string }
        cursor: { type: object, additionalProperties: true }
        unresolved: { type: array, items: {} }
        report: { type: object, additionalProperties: true }
        stopReason: { type: string }
        deliverableStatus: { type: string }
        reconciliationRequired: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    RoundResults:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
    RoundMutationRequest:
      type: object
      additionalProperties: false
      required: [requestKey, operation, resourceId, expectedRevision]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
        operation: { type: string, enum: [company.create, opportunity.create] }
        resourceId: { type: string }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        company: { $ref: '#/components/schemas/CreateCompanyRequest' }
        opportunity: { $ref: '#/components/schemas/CreateOpportunityRequest' }
    RoundMutationResult:
      type: object
      required: [attemptId, entityKind, entityId, revision, auditId]
      properties:
        attemptId: { type: string }
        entityKind: { type: string, enum: [company, opportunity] }
        entityId: { type: string }
        revision: { type: integer, format: int64 }
        auditId: { type: string }
    CodexStatus:
      type: object
      required: [state, code, connected, ingestionAvailable, busy]
      properties:
        state: { type: string, enum: [unavailable, needs_sign_in, connecting, ready] }
        code: { type: string, description: Safe readiness or failure code. }
        connected: { type: boolean }
        ingestionAvailable: { type: boolean }
        busy: { type: boolean }
    CodexConnection:
      type: object
      required: [loginId, verificationUrl, userCode]
      properties:
        loginId: { type: string }
        verificationUrl: { type: string, format: uri }
        userCode: { type: string }
    RuntimeStatus:
      type: object
      required: [ingestionAvailable, organisationAvailable, collectionAvailable]
      properties:
        ingestionAvailable: { type: boolean }
        organisationAvailable: { type: boolean }
        collectionAvailable:
          {
            type: boolean,
            description: Collector loop mounted; enabled board count and run outcomes are separate.,
          }
    CollectorBoard:
      type: object
      required:
        [
          id,
          provider,
          site,
          region,
          displayName,
          enabled,
          intervalMinutes,
          nextScanAt,
          revision,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        provider: { type: string, enum: [lever] }
        site: { type: string }
        displayName: { type: string }
        officialCareersUrl: { type: string, format: uri }
        verifiedAt: { type: string, format: date-time }
        region: { type: string, enum: [global, eu] }
        enabled: { type: boolean }
        intervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
        nextScanAt: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        lastSuccessAt: { type: string, format: date-time }
        lastErrorCode: { type: string }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CollectorBoardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CollectorBoard' }
    CreateCollectorBoardRequest:
      type: object
      required: [provider, site, region, enabled, intervalMinutes]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [lever] }
        site: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, maxLength: 200 }
        region: { type: string, enum: [global, eu] }
        enabled: { type: boolean }
        intervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
    UpdateCollectorBoardRequest:
      type: object
      required: [expectedRevision, enabled, intervalMinutes]
      additionalProperties: false
      properties:
        expectedRevision: { type: integer, format: int64 }
        enabled: { type: boolean }
        intervalMinutes: { type: integer, minimum: 15, maximum: 10080 }
    OrganisationCategory:
      type: object
      required: [id, description]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 1000 }
    OrganisationCategorySet:
      type: object
      required: [version, categories]
      properties:
        version: { type: integer, format: int64 }
        categories:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/OrganisationCategory' }
        createdAt: { type: string, format: date-time }
    UpdateOrganisationCategoriesRequest:
      type: object
      required: [expectedVersion, categories]
      additionalProperties: false
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        categories:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/OrganisationCategory' }
    OrganisationSourceFact:
      type: object
      required: [id, sourceId, sourceRevision, sourceKind, excerpt]
      properties:
        id: { type: string }
        sourceId: { type: string }
        sourceRevision: { type: string }
        sourceKind: { type: string }
        observedAt: { type: string }
        excerpt: { type: string }
    OrganisationSourceRef:
      type: object
      required: [factId, sourceId, sourceRevision, sourceKind]
      properties:
        factId: { type: string }
        sourceId: { type: string }
        sourceRevision: { type: string }
        sourceKind: { type: string }
    OrganisationAssessment:
      type: object
      required:
        [
          id,
          categorySetVersion,
          disposition,
          sourceFacts,
          sourceRefs,
          requestedModel,
          returnedModel,
          createdAt,
        ]
      properties:
        id: { type: string }
        categorySetVersion: { type: integer, format: int64 }
        disposition: { type: string, enum: [category_selected, uncertain] }
        categoryId: { type: string }
        categoryDescription:
          { type: string, description: Category definition captured at assessment time. }
        sourceFacts:
          type: array
          items: { $ref: '#/components/schemas/OrganisationSourceFact' }
        sourceRefs:
          type: array
          items: { $ref: '#/components/schemas/OrganisationSourceRef' }
        requestedModel: { type: string }
        returnedModel: { type: string }
        createdAt: { type: string, format: date-time }
    OrganisationView:
      type: object
      required: [status, current, latestHistorical]
      properties:
        status:
          {
            type: string,
            enum: [unconfigured, pending, processing, selected, uncertain, failed, outdated],
          }
        current:
          allOf: [{ $ref: '#/components/schemas/OrganisationAssessment' }]
          nullable: true
        latestHistorical:
          allOf: [{ $ref: '#/components/schemas/OrganisationAssessment' }]
          nullable: true
        jobId: { type: string }
    OrganisationSummary:
      type: object
      required: [opportunityId, status]
      properties:
        opportunityId: { type: string }
        status:
          {
            type: string,
            enum: [unconfigured, pending, processing, selected, uncertain, failed, outdated],
          }
        categoryId: { type: string }
    OrganisationSummaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrganisationSummary' }
    SubmitIngestionRequest:
      type: object
      required: [idempotencyKey]
      additionalProperties: false
      properties:
        sourceUrl: { type: string, maxLength: 2048 }
        originalText: { type: string, maxLength: 200000 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
    RetryIngestionRequest:
      type: object
      additionalProperties: false
      properties:
        originalText: { type: string, maxLength: 200000 }
    IngestionRequest:
      type: object
      required:
        [
          id,
          origin,
          sourceUrl,
          originalText,
          status,
          jobId,
          jobState,
          attemptsStarted,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        origin: { type: string }
        sourceUrl: { type: string }
        originalText: { type: string }
        status: { type: string, enum: [pending, processing, completed, needs_text, failed] }
        jobId: { type: string }
        jobState: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        attemptsStarted: { type: integer, format: int64 }
        connectorId: { type: string }
        externalId: { type: string }
        discoveredAt: { type: string, format: date-time }
        opportunityId: { type: string }
        recordChangeId: { type: string }
        safeErrorCode: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IngestionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/IngestionRequest' }
        nextCursor: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          writeOnly: true
    SessionResponse:
      type: object
      required: [actorKind, actorId, csrfToken, expiresAt]
      properties:
        actorKind:
          type: string
          enum: [administrator]
        actorId:
          type: string
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    RoleCriterion:
      type: object
      required: [id, label, description, kind, mode]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        label: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        kind: { type: string, enum: [role, responsibility, technology] }
        mode: { type: string, enum: [require, avoid, prefer] }
    RoleCriterionView:
      allOf:
        - $ref: '#/components/schemas/RoleCriterion'
        - type: object
          required: [definitionHash]
          properties:
            definitionHash:
              {
                type: string,
                readOnly: true,
                description: Server-calculated SHA-256 of the complete criterion definition.,
              }
    PreferencesInput:
      type: object
      required:
        [
          preferredLocation,
          allowRemote,
          allowHybrid,
          targetHours,
          minMonthlyBaseCents,
          salaryCurrency,
          timezone,
          roleCriteria,
        ]
      properties:
        preferredLocation:
          type: string
        allowRemote:
          type: boolean
        allowHybrid:
          type: boolean
        targetHours:
          type: string
          pattern: '^(?:[1-9][0-9]?|1[0-5][0-9]|16[0-8])(?:[.][0-9]{1,2})?$'
          description: Decimal weekly hours with at most two places. The server stores exact hundredths.
        minMonthlyBaseCents:
          type: integer
          format: int64
        salaryCurrency:
          type: string
        timezone:
          type: string
        roleCriteria:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/RoleCriterion' }
    PreferencesResponse:
      type: object
      required:
        [
          version,
          preferredLocation,
          allowRemote,
          allowHybrid,
          targetHours,
          minMonthlyBaseCents,
          salaryCurrency,
          timezone,
          roleCriteria,
        ]
      properties:
        version: { type: integer, format: int64 }
        preferredLocation: { type: string }
        allowRemote: { type: boolean }
        allowHybrid: { type: boolean }
        targetHours: { type: string }
        minMonthlyBaseCents: { type: integer, format: int64 }
        salaryCurrency: { type: string }
        timezone: { type: string }
        roleCriteria:
          type: array
          items: { $ref: '#/components/schemas/RoleCriterionView' }
    UpdatePreferencesRequest:
      allOf:
        - $ref: '#/components/schemas/PreferencesInput'
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, format: int64, minimum: 1 }
    PreferencesMutation:
      type: object
      required: [preferences, changeId]
      properties:
        preferences: { $ref: '#/components/schemas/PreferencesResponse' }
        changeId: { type: string }
    AgentCredential:
      type: object
      required: [id, name, scopes, createdAt, expiresAt, revoked]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
    AgentCredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentCredential'
    CreateAgentCredentialRequest:
      type: object
      additionalProperties: false
      required: [name, scopes, expiresAt]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
    CreatedAgentCredential:
      type: object
      required: [credential, token]
      properties:
        credential:
          $ref: '#/components/schemas/AgentCredential'
        token:
          type: string
          description: Only returned at creation; store securely.
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          enum: [jobseek-api]
        version:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            [
              validation_error,
              not_found,
              unauthenticated,
              forbidden,
              csrf_failed,
              rate_limited,
              conflict,
              unavailable,
              internal_error,
            ]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ActionDue:
      type: object
      additionalProperties: false
      description: Exactly date or at plus timezone is required; the server rejects mixed or incomplete shapes.
      properties:
        date: { type: string, description: Real YYYY-MM-DD calendar date without an instant. }
        at:
          {
            type: string,
            format: date-time,
            description: RFC3339 instant with offset matching the IANA timezone at that instant.,
          }
        timezone: { type: string, description: Valid IANA timezone for local display. }
    Action:
      type: object
      required: [id, opportunityId, description, due, status, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        opportunityId:
          {
            type: string,
            description: Empty for standalone actions. Archived opportunity links remain readable.,
          }
        description: { type: string }
        due: { $ref: '#/components/schemas/ActionDue' }
        dueAtUtc:
          {
            type: string,
            format: date-time,
            description: Normalized stored UTC instant for timed deadlines; due.at is formatted in due.timezone for valid round-trip replacement.,
          }
        status: { type: string, enum: [open, completed, cancelled] }
        completedAt: { type: string, format: date-time }
        revision: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ActionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        nextCursor: { type: string }
