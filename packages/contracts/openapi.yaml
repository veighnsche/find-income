    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidenceSources
      summary: Page immutable, attributable evidence sources
      description: Bearer credentials require opportunities:read. Sources remain historical after context changes.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Source page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSourcePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence-sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: sourceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidenceSource
      summary: Read an immutable source within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listEvidence
      summary: Page sourced claims, optionally including superseded history
      description: Bearer credentials require opportunities:read. Raw claims are not qualification results.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: includeSuperseded
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Claim page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidencePage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/evidence/{evidenceId}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
      - name: evidenceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvidence
      summary: Read one immutable claim within its opportunity
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Claim
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceClaim' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /opportunities/{id}/qualification:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getQualification
      summary: Read current qualification, refreshing stale local inputs deterministically
      description: Bearer credentials require opportunities:read. A failed refresh cannot report historical results as current.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Qualification view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Local refresh failed; current is null and historical evaluation is marked outdated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationView' }
  /opportunities/{id}/qualification/history:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: listQualificationHistory
      summary: Page immutable evaluations with captured preference versions
      description: Bearer credentials require opportunities:read.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Evaluation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualificationHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
    ActionClock:
      name: at
      in: query
      required: true
      description: Explicit RFC3339 instant with offset.
      schema: { type: string, format: date-time }
    ActionCalendarTimezone:
      name: calendarTimezone
      in: query
      required: true
      description: IANA timezone used only to compare date-only deadlines.
      schema: { type: string }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: jobseek_session
      description: Owner session. Cookie mutations also require X-CSRF-Token and same-origin Origin.
    bearerAuth:
      type: http
      scheme: bearer
      description: Named agent token with operation-specific scopes.
  responses:
    Unavailable:
      description: Required round execution capability is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Revision conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many login attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ImportCorrespondenceRequest:
      type: object
      additionalProperties: false
      required: [provider, externalAccountId, threads]
      properties:
        provider: { type: string, minLength: 1, maxLength: 80 }
        externalAccountId: { type: string, minLength: 1, maxLength: 320 }
        displayName: { type: string, maxLength: 200 }
        threads:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [providerThreadId, messages]
            properties:
              providerThreadId: { type: string, minLength: 1, maxLength: 320 }
              subject: { type: string, maxLength: 500 }
              lastMessageAt: { type: string }
              messages:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: object
                  additionalProperties: false
                  required: [providerMessageId, sender, sentAt, body]
                  properties:
                    providerMessageId: { type: string, minLength: 1, maxLength: 320 }
                    sender: { type: string, maxLength: 320 }
                    recipients: { type: array, items: { type: string } }
                    sentAt: { type: string, minLength: 1 }
                    body: { type: string, minLength: 1, maxLength: 100000 }
    ImportCorrespondenceResponse:
      type: object
      required: [accountId, threads, messages]
      properties:
        accountId: { type: string }
        threads: { type: integer }
        messages: { type: integer }
    ProcessRepliesRequest:
      type: object
      additionalProperties: false
      required: [requestKey]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
    ReplyCommissionResponse:
      type: object
      required: [processingId, threadId, round]
      properties:
        processingId: { type: string }
        threadId: { type: string }
        round: { $ref: '#/components/schemas/Round' }
    CorrespondenceThreadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CorrespondenceThread' }
    CorrespondenceThread:
      type: object
      required: [id, accountId, subject, messageCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        subject: { type: string }
        opportunityId: { type: string }
        lastMessageAt: { type: string }
        messageCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    CorrespondenceThreadDetail:
      type: object
      required: [thread, messages]
      properties:
        thread: { $ref: '#/components/schemas/CorrespondenceThread' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/CorrespondenceMessage' }
    CorrespondenceMessage:
      type: object
      required: [id, sender, sentAt, bodySha256, body]
      properties:
        id: { type: string }
        sender: { type: string }
        recipients: { type: array, items: { type: string } }
        sentAt: { type: string }
        bodySha256: { type: string }
        body: { type: string }
    ReplyProcessingDetail:
      type: object
      required: [processing]
      properties:
        processing: { $ref: '#/components/schemas/ReplyProcessing' }
        draft: { $ref: '#/components/schemas/ReplyDraft' }
    ReplyProcessing:
      type: object
      required: [id, threadId, createdAt, updatedAt]
      properties:
        id: { type: string }
        threadId: { type: string }
        roundId: { type: string }
        intent: { type: string }
        opportunityId: { type: string }
        processedAt: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    ReplyDraft:
      type: object
      required: [id, revision, draft]
      properties:
        id: { type: string }
        revision: { type: integer }
        draftSha256: { type: string }
        draft: { type: object }
    PrepareInterviewRequest:
      type: object
      additionalProperties: false
      required: [requestKey, opportunityId, context]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
        opportunityId: { type: string, minLength: 1 }
        context:
          {
            type: string,
            minLength: 1,
            maxLength: 30000,
            description: Complete owner supplied invitation and relevant context in one payload,
          }
    DebriefInterviewRequest:
      type: object
      additionalProperties: false
      required: [requestKey, notes]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
        notes:
          {
            type: string,
            minLength: 1,
            maxLength: 30000,
            description: Complete owner reported debrief notes,
          }
    InterviewCommissionResponse:
      type: object
      required: [interviewId, round]
      properties:
        interviewId: { type: string }
        round: { $ref: '#/components/schemas/Round' }
    DebriefInterviewResponse:
      type: object
      required: [debriefId, interviewId, round]
      properties:
        debriefId: { type: string }
        interviewId: { type: string }
        round: { $ref: '#/components/schemas/Round' }
    InterviewCitation:
      type: object
      required: [sourceId, excerpt]
      properties:
        sourceId: { type: string }
        excerpt: { type: string }
    InterviewCitedText:
      type: object
      required: [text, citations]
      properties:
        text: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/InterviewCitation' } }
    InterviewContextSource:
      type: object
      required: [id, kind, revision, sha256, body]
      properties:
        id: { type: string }
        kind: { type: string, enum: [invitation, owner_input, role, employer] }
        revision: { type: string }
        sha256: { type: string }
        body: { type: string }
    InterviewCareerSource:
      type: object
      required: [id, name, sha256, approved, body]
      properties:
        id: { type: string }
        name: { type: string }
        sha256: { type: string }
        approved: { type: boolean }
        body: { type: string }
    InterviewFocusAlternative:
      type: object
      required: [id, why]
      properties:
        id: { type: string }
        why: { $ref: '#/components/schemas/InterviewCitedText' }
    InterviewQuestion:
      type: object
      required: [text, why]
      properties:
        text: { type: string }
        why: { $ref: '#/components/schemas/InterviewCitedText' }
    InterviewExample:
      type: object
      required: [title, experienceKind, contextBasis, situation, action]
      properties:
        title: { type: string }
        experienceKind:
          { type: string, enum: [personal_project, employment, education, volunteer, other] }
        contextBasis: { $ref: '#/components/schemas/InterviewCitation' }
        situation: { $ref: '#/components/schemas/InterviewCitedText' }
        action: { $ref: '#/components/schemas/InterviewCitedText' }
        result: { $ref: '#/components/schemas/InterviewCitedText' }
        unknownResult: { type: string }
    InterviewScheduleClaim:
      type: object
      required: [citation]
      properties:
        startRfc3339: { type: string, format: date-time }
        endRfc3339: { type: string, format: date-time }
        mode: { type: string, enum: [video, phone, in_person] }
        venue: { type: string }
        citation: { $ref: '#/components/schemas/InterviewCitation' }
    InterviewDraft:
      type: object
      required: [focus, questions, examples]
      properties:
        focus: { type: array, items: { $ref: '#/components/schemas/InterviewFocusAlternative' } }
        questions: { type: array, items: { $ref: '#/components/schemas/InterviewQuestion' } }
        examples: { type: array, items: { $ref: '#/components/schemas/InterviewExample' } }
        scheduleClaims:
          { type: array, items: { $ref: '#/components/schemas/InterviewScheduleClaim' } }
        unknowns: { type: array, items: { type: string } }
    InterviewBrief:
      type: object
      required: [input, inputSha256]
      properties:
        input:
          type: object
          required:
            [interviewId, opportunityId, roleTitle, employerName, context, careerSources, draft]
          properties:
            interviewId: { type: string }
            opportunityId: { type: string }
            roleTitle: { type: string }
            employerName: { type: string }
            context: { type: array, items: { $ref: '#/components/schemas/InterviewContextSource' } }
            careerSources:
              { type: array, items: { $ref: '#/components/schemas/InterviewCareerSource' } }
            draft: { $ref: '#/components/schemas/InterviewDraft' }
        inputSha256: { type: string }
    InterviewFocusSummary:
      type: object
      required: [disposition, inputSha256]
      properties:
        disposition: { type: string, enum: [selected, unresolved] }
        selectedId: { type: string }
        inputSha256: { type: string }
        jevAttemptId: { type: string }
    InterviewView:
      type: object
      required:
        [
          id,
          opportunityId,
          opportunityRevision,
          profileVersion,
          context,
          contextSha256,
          current,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        opportunityId: { type: string }
        opportunityRevision: { type: integer, format: int64 }
        profileVersion: { type: integer, format: int64 }
        context: { type: string }
        contextSha256: { type: string }
        roundId: { type: string }
        current: { type: boolean }
        brief: { $ref: '#/components/schemas/InterviewBrief' }
        focus: { $ref: '#/components/schemas/InterviewFocusSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InterviewList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InterviewView' } }
    InterviewDebriefObservation:
      type: object
      required: [kind, detail]
      properties:
        kind: { type: string, enum: [discussed, went_well, unclear, follow_up] }
        detail: { $ref: '#/components/schemas/InterviewCitedText' }
    InterviewDebriefRecord:
      type: object
      required: [id, interviewId, notes, createdAt, updatedAt]
      properties:
        id: { type: string }
        interviewId: { type: string }
        notes: { type: string }
        roundId: { type: string }
        observations:
          { type: array, items: { $ref: '#/components/schemas/InterviewDebriefObservation' } }
        unknowns: { type: array, items: { type: string } }
        attribution: { type: string, enum: [owner_reported] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InterviewDetail:
      type: object
      required: [interview, debriefs]
      properties:
        interview: { $ref: '#/components/schemas/InterviewView' }
        debriefs: { type: array, items: { $ref: '#/components/schemas/InterviewDebriefRecord' } }
    DeliveryCapability:
      type: object
      required: [submissionAvailable, receiptLookup]
      properties:
        submissionAvailable: { type: boolean }
        receiptLookup: { type: boolean }
        reason: { type: string }
    PrepareDeliveryReviewRequest:
      type: object
      additionalProperties: false
      required: [requestKey, packIds]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 180 }
        packIds:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string }
    ApproveDeliveryReviewRequest:
      type: object
      additionalProperties: false
      required: [materialSha256]
      properties:
        materialSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    DeliveryReview:
      type: object
      required: [id, materialSha256, items]
      properties:
        id: { type: string }
        materialSha256: { type: string }
        approvedSha256: { type: string }
        approvedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryItem' }
    DeliveryItem:
      type: object
      required:
        [
          id,
          reviewId,
          packId,
          opportunityId,
          opportunityRevision,
          sourceSha256,
          profileRevision,
          packContentSha256,
          routeId,
          routeRevision,
          routeSha256,
          title,
          companyName,
          routeExcerpt,
          recipient,
          sender,
          subject,
          body,
          attachmentSha256,
          mimeSha256,
          messageId,
          state,
          current,
        ]
      properties:
        id: { type: string }
        reviewId: { type: string }
        packId: { type: string }
        opportunityId: { type: string }
        opportunityRevision: { type: integer, format: int64 }
        sourceSha256: { type: string }
        profileRevision: { type: integer, format: int64 }
        packContentSha256: { type: string }
        routeId: { type: string }
        routeRevision: { type: integer, format: int64 }
        routeSha256: { type: string }
        title: { type: string }
        companyName: { type: string }
        routeExcerpt: { type: string }
        recipient: { type: string }
        sender: { type: string }
        subject: { type: string }
        body: { type: string }
        attachmentSha256: { type: string }
        mimeSha256: { type: string }
        messageId: { type: string }
        state: { type: string, enum: [prepared, sending, accepted_by_smtp, failed, uncertain] }
        roundId: { type: string }
        attemptId: { type: string }
        smtpStage: { type: string }
        smtpCode: { type: integer }
        outcomeDetail: { type: string }
        current: { type: boolean }
        blockingReason: { type: string }
    DeliverySendResult:
      type: object
      required: [review, round]
      properties:
        review: { $ref: '#/components/schemas/DeliveryReview' }
        round: { $ref: '#/components/schemas/Round' }
    DeliveryReconciliation:
      type: object
      required: [supported, reason]
      properties:
        supported: { type: boolean }
        reason: { type: string }
    RoundAllowance:
      type: object
      required: [requests, items, tools, turns]
      properties:
        requests: { type: integer, format: int64, minimum: 0 }
        items: { type: integer, format: int64, minimum: 0 }
        tools: { type: integer, format: int64, minimum: 0 }
        turns: { type: integer, format: int64, minimum: 0 }
    RoundScope:
      type: object
      required: [inputRefs, resources, operations, delegates]
      properties:
        inputRefs: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }
        operations: { type: array, items: { type: string } }
        delegates: { type: array, items: { type: string } }
    PrepareRoundRequest:
      type: object
      additionalProperties: false
      description: Owner selects an existing sourced opportunity; the server derives all pack details and authority.
      required: [requestKey, opportunityId]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 200 }
        opportunityId: { type: string, minLength: 1 }
        replacePaused: { $ref: '#/components/schemas/ReplacePausedRound' }
    CompareOffersRoundRequest:
      type: object
      additionalProperties: false
      required: [requestKey, offers]
      properties:
        requestKey: { type: string, minLength: 1, maxLength: 180 }
        offers:
          {
            type: array,
            minItems: 1,
            maxItems: 5,
            items: { type: string, minLength: 1, maxLength: 20000 },
          }
        prioritiesText: { type: string, maxLength: 5000 }
    CompareOffersRoundResponse:
      type: object
      required: [round, intakeId]
      properties:
        round: { $ref: '#/components/schemas/Round' }
        intakeId: { type: string }
    OfferComparisonResult:
      type: object
      required: [id, intakeId, roundId, comparison, tradeoffStatus, current, createdAt]
      properties:
        id: { type: string }
        intakeId: { type: string }
        roundId: { type: string }
        comparison: { $ref: '#/components/schemas/OfferComparisonSnapshot' }
        tradeoffStatus:
          {
            type: string,
            enum:
              [
                not_requested,
                pending,
                selected,
                unresolved,
                invalid,
                failed,
                unavailable,
                uncertain,
              ],
          }
        tradeoff: { $ref: '#/components/schemas/OfferTradeoffSelection' }
        current: { type: boolean }
        createdAt: { type: string, format: date-time }
    OfferComparisonSnapshot:
      type: object
      required: [input, inputSha256, views, pay, missing]
      properties:
        input: { $ref: '#/components/schemas/OfferComparisonInput' }
        inputSha256: { type: string }
        views: { type: array, items: { $ref: '#/components/schemas/OfferPayView' } }
        pay: { type: array, items: { $ref: '#/components/schemas/OfferPayPair' } }
        missing: { type: array, items: { $ref: '#/components/schemas/OfferMissingTerms' } }
    OfferComparisonInput:
      type: object
      required: [sources, offers]
      properties:
        sources: { type: array, items: { $ref: '#/components/schemas/OfferComparisonSource' } }
        offers: { type: array, items: { $ref: '#/components/schemas/OfferComparisonOffer' } }
        alternatives:
          { type: array, items: { $ref: '#/components/schemas/OfferReviewAlternative' } }
    OfferComparisonSource:
      type: object
      required: [id, kind, revision, sha256, body]
      properties:
        id: { type: string }
        offerId: { type: string }
        kind: { type: string }
        revision: { type: string }
        sha256: { type: string }
        body: { type: string }
    OfferCitation:
      type: object
      required: [sourceId, excerpt]
      properties:
        sourceId: { type: string }
        excerpt: { type: string }
    OfferCitedText:
      type: object
      required: [text, citations]
      properties:
        text: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/OfferCitation' } }
    OfferComparisonOffer:
      type: object
      required: [id, employer, engagement, pay, hours, holiday]
      properties:
        id: { type: string }
        employer: { type: string }
        employerCitation: { $ref: '#/components/schemas/OfferCitation' }
        engagement: { type: string, enum: [employment, project, unknown] }
        engagementCitation: { $ref: '#/components/schemas/OfferCitation' }
        pay: { $ref: '#/components/schemas/OfferPayTerm' }
        hours: { $ref: '#/components/schemas/OfferHoursTerm' }
        holiday: { $ref: '#/components/schemas/OfferHolidayTerm' }
        benefits: { type: array, items: { $ref: '#/components/schemas/OfferCitedText' } }
