      type: object
      additionalProperties: false
      required: [description, due]
      properties:
        opportunityId: { type: string }
        description: { type: string, minLength: 1, maxLength: 2000 }
        due: { $ref: '#/components/schemas/ActionDue' }
    PatchActionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      description: At least one of description or due must be supplied. Final-state actions cannot be patched.
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        due: { $ref: '#/components/schemas/ActionDue' }
