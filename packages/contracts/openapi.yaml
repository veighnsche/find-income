openapi: 3.0.3
info:
  title: Jobseek dashboard API
  version: 0.1.0
  description: Versioned private dashboard API. All data routes require authentication.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API process health
      responses:
        '200':
          description: API process is serving requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /rounds:
    get:
      operationId: listRounds
      summary: List rounds newest-first for server run recovery
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: outcome
          schema: { type: string, maxLength: 100 }
        - in: query
          name: state
          explode: true
          schema: { type: array, items: { type: string } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Newest-first round page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Round' } }
                  nextCursor: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
  /rounds/active:
    get:
      operationId: getActiveRound
      summary: Read the active commissioned round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Active round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/latest-completed:
    get:
      operationId: getLatestCompletedRound
      summary: Read the owner's latest saved round result
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: outcome
          required: true
          schema:
            {
              type: string,
              enum:
                [
                  all,
                  process_input,
                  prepare,
                  research_run,
                ],
            }
      responses:
        '200':
          description: Latest matching saved result with transient next-action currentness, or null when none exists
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/Round' }]
                nullable: true
        '400': { $ref: '#/components/responses/ValidationError' }
  /rounds/process-input:
    post:
      operationId: processOwnerInput
      summary: Save one contextual owner input and commission its bounded record work
      description: The target identity and revision come from the visible record. An exact request key resumes the same saved input and round. A paused replacement requires the owner to name the exact paused round and revision.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessInputRequest' }
      responses:
        '200':
          description: Existing saved input and round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessInputResponse' }
        '201':
          description: Input saved and round commissioned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessInputResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rounds/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRound
      summary: Read a commissioned round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/{id}/results:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRoundResults
      summary: Read committed results for a round
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Result list,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RoundResults' } } },
          }
  /rounds/{id}/history:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRoundHistory
      summary: Read the round's linked audited record history
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Typed history events
          content: { application/json: { schema: { $ref: '#/components/schemas/RoundHistory' } } }
  /owner-instructions:
    get:
      operationId: listOwnerInstructions
      summary: Read active contextual owner instructions
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: roundId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Owner instructions
          content:
            { application/json: { schema: { $ref: '#/components/schemas/OwnerInstructions' } } }
    post:
      operationId: addOwnerInstruction
      summary: Save explicit owner context for one target
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/OwnerInstructionInput' } } }
      responses:
        '200':
          description: Exact replay
          content:
            { application/json: { schema: { $ref: '#/components/schemas/OwnerInstruction' } } }
        '201':
          description: Instruction saved
          content:
            { application/json: { schema: { $ref: '#/components/schemas/OwnerInstruction' } } }
  /owner-instructions/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: revokeOwnerInstruction
      summary: Revoke an owner instruction before further use
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Instruction revoked }
  /opportunities/{id}/decision:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getOwnerOpportunityDecision
      summary: Read the owner's latest direct decision
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Latest decision
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDecision' } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: setOwnerOpportunityDecision
      summary: Save select, dismiss, or acknowledge without a model turn
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/OwnerDecisionInput' } } }
      responses:
        '200':
          description: Exact replay
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDecision' } } }
        '201':
          description: Decision saved
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerDecision' } } }
  /workflow/roles:
    get:
      operationId: listRoleWorkflows
      summary: List each selected role with its authoritative journey stage
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Selected roles and stages
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RoleWorkflowList' } } }
  /opportunities/{id}/workflow:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getRoleWorkflow
      summary: Read one selected role's authoritative journey stage
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Role stage
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RoleWorkflowState' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /rounds/{id}/stop:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: stopRound
      summary: Owner fences further round work and requests cancellation
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Stopped round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
  /rounds/{id}/resume:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: resumeRound
      summary: Owner resumes after bounded reconciliation
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Resumed round,
            content: { application/json: { schema: { $ref: '#/components/schemas/Round' } } },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /rounds/{id}/mutations:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: applyRoundMutation
      summary: Delegated agent performs one atomic round record mutation
      description: Requires a named bearer agent with opportunities:write, present in scope.delegates, and a secret capability bound to one dispatched turn. Actor, resource, operation, profile revision, generation, cost and audit link are checked in one write transaction.
      parameters:
        - name: X-Round-Capability
          in: header
          required: true
          schema: { type: string }
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            { application/json: { schema: { $ref: '#/components/schemas/RoundMutationRequest' } } },
        }
      responses:
        '200':
          {
            description: Exact replay,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/RoundMutationResult' } },
              },
          }
        '201':
          {
            description: Record created,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/RoundMutationResult' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /research/runs:
    get:
      operationId: listResearchRuns
      summary: List research runs newest-first for server run recovery
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: outcome
          schema: { type: string, maxLength: 100 }
        - in: query
          name: state
          explode: true
          schema: { type: array, items: { type: string } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Newest-first run page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunHistoryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: commissionResearchRun
      summary: Commission one bounded autonomous research run
      description: Creates a run from the current brief plus optional corrections and a finite allowance. No source, query, company or vacancy fields are required. Run control stays on rounds/{id}/stop|resume.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CommissionResearchRequest' } },
          }
      responses:
        '201':
          {
            description: Run commissioned,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ResearchRunView' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /research/runs/latest-terminal:
    get:
      operationId: getLatestTerminalResearchRun
      summary: Read the newest completed/failed run for one outcome
      security: [{ cookieAuth: [] }]
      parameters:
        - in: query
          name: outcome
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Latest terminal run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunHistoryItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /research/owner-context:
    get:
      operationId: getSourcedOwnerContext
      summary: Read owner identity plus approved career sources with provenance
      description: Pure GET-only read with zero model calls. Sources ground drafts and panels; the reusable answer library is served separately.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Sourced owner context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcedOwnerContext' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /research/runs/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getResearchRun
      summary: Read one research run projection
      description: Side-effect-free; reading never commissions work.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Run view,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ResearchRunView' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/runs/{id}/steer:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    post:
      operationId: steerResearchRun
      summary: Send a durable steering message to a run
      description: Corrections that change applicable facts or permissions rotate authority and fence affected pending writes.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/SteerResearchRequest' } } }
      responses:
        '200':
          {
            description: Steering message stored,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SteeringMessage' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /research/runs/{id}/activity:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: listResearchActivity
      summary: Page journaled research activity events
      description: Deduplicated event IDs with cursor pagination; reconnect resumes without double-count. Side-effect-free.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          {
            description: Activity page,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/ResearchActivityPage' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/runs/{id}/report:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getResearchReport
      summary: Read the evidence-backed run report
      description: Useful outcomes, what was searched/reused, remaining uncertainty, budget/stop reasons and next work. Side-effect-free.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Run report,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ResearchReportView' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/captures/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: getResearchCapture
      summary: Read one immutable capture descriptor
      description: Originals stay server-side; no raw protocol payloads or credentials in the DTO. Side-effect-free.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Capture view,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/ResearchCaptureView' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/identity:
    get:
      operationId: explainResearchIdentity
      summary: Explain an employer/vacancy identity decision
      description: Candidates, decision, basis, assessment and sightings behind a same/new/unresolved call. Side-effect-free.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: subjectKind
          in: query
          required: true
          schema: { type: string, enum: [employer, vacancy] }
        - name: subjectId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          {
            description: Identity explanation,
            content:
              {
                application/json: { schema: { $ref: '#/components/schemas/ResearchIdentityView' } },
              },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
  /research/brief:
    get:
      operationId: getSearchBrief
      summary: Read the current search brief with rubric and catalog versions
      description: Versioned owner profile, retained requirements, and reason-catalog version. Side-effect-free.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Search brief,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/SearchBriefView' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /research/briefs/{version}/catalog:
    parameters:
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getReasonCatalog
      summary: Read the saved reason catalog for one brief version
      description: Immutable authored positive, negative, and missing-information reason choices. Side-effect-free.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          {
            description: Reason catalog,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ReasonCatalogView' } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /research/runs/{id}/findings:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    get:
      operationId: listRunFindings
      summary: List collected vacancies with saved groups and reasons
      description: One entry per collected vacancy with group, saved reason selections, and evidence links. Side-effect-free.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: group
          in: query
          schema:
            type: string
            enum:
              [
                recommended,
                could_be_recommended,
                probably_not_recommended,
                not_recommended,
                unknown,
              ]
      responses:
        '200':
          {
            description: Finding list,
            content: { application/json: { schema: { $ref: '#/components/schemas/FindingList' } } },
          }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/login:
    post:
      operationId: login
      summary: Start the owner's dashboard session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current owner session
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/session:
    get:
      operationId: getSession
      summary: Read the current owner session and CSRF token
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active owner session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /preferences:
    get:
      operationId: getPreferences
      summary: Read current qualification preferences
      security:
        - cookieAuth: []
        - bearerAuth: []
      description: Bearer credentials require the preferences:read scope.
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updatePreferences
      summary: Save the owner's deterministic wants/do-not-wants profile
      description: Complete profile write with expected-version fencing; sourced experience stays in evidence and owner sources, never in this profile.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Saved profile with change record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesMutation'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agent-credentials:
    get:
      operationId: listAgentCredentials
      summary: List named agent credentials without their tokens
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Credentials metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCredentialList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAgentCredential
      summary: Create a scoped agent token; raw token appears once
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentCredentialRequest'
      responses:
        '201':
          description: Credential and one-time token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAgentCredential'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /agent-credentials/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeAgentCredential
      summary: Revoke an agent token immediately
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Credential revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /companies:
    get:
      operationId: listCompanies
      summary: List companies in stable creation order
      description: Bearer credentials require opportunities:read. Cursor is bound to the archived filter.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: Company page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /companies/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      operationId: getCompany
      summary: Read a company and likely duplicate warnings
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      description: Bearer credentials require opportunities:read.
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /muse/readiness:
    get:
      operationId: getMuseReadiness
      summary: Read local Muse session readiness for one tier
      description: Owner session required. Reports the frozen musecode readiness verdict without commissioning any session input. Unknown tiers fail closed.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: tier
          in: query
          required: true
          schema: { type: string, enum: [contributor, standard] }
      responses:
        '200':
          description: Tier readiness verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MuseReadiness' }
        '400': { $ref: '#/components/responses/ValidationError' }
